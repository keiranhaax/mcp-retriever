services:
  mcp-retriever:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-retriever
    restart: unless-stopped
    # Compose's interpolation .env is not injected automatically.
    env_file:
      - .env
    environment:
      MCP_API_KEY: ${MCP_API_KEY:?Set a non-blank MCP_API_KEY in .env}
      # Listen on the container interface; publish only on host loopback.
      MCPO_HOST: '0.0.0.0'
      PORT: ${PORT:-8000}
    ports:
      - '${MCPO_BIND_HOST:-127.0.0.1}:${PORT:-8000}:${PORT:-8000}'
